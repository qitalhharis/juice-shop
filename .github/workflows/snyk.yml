      name: Check GitHub secrets
      env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          TEST_SECRET: ${{ secrets.TEST_SECRET }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "SNYK_TOKEN tersedia"
          else
            echo "SNYK_TOKEN tidak tersedia"
          fi

          if [ -n "$TEST_SECRET" ]; then
            echo "TEST_SECRET tersedia"
          else
            echo "TEST_SECRET tidak tersedia"
          fi

